name: SOD Pending Sync (Every 15 min)

on:
  schedule:
    # Runs at 0, 15, 30, 45 minutes past every hour (UTC)
    - cron: "0,15,30,45 * * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  sync-pending-sods:
    name: Sync Pending SODs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger Pending SOD Sync Batches
        run: |
          echo "Triggering SOD Pending Sync at $(date -u)"
          
          run_batch() {
            local BATCH_NAME=$1
            local OFFSET=$2
            echo "Syncing $BATCH_NAME (OPMCs $OFFSET to $(($OFFSET + 15)))..."
            RESPONSE=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X GET -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "https://sltserp.vercel.app/api/cron/sync-sod?offset=$OFFSET&limit=15")
            
            if [ "$RESPONSE" != "200" ]; then
              echo "ERROR: $BATCH_NAME failed with HTTP $RESPONSE"
              cat /tmp/resp.json
              exit 1
            fi
            echo "$BATCH_NAME completed successfully."
          }

          run_batch "Batch 1" 0
          run_batch "Batch 2" 15
          run_batch "Batch 3" 30
          
          echo "All SOD Sync Batches completed successfully."

