name: SOD Pending Sync (Every 15 min)

on:
  schedule:
    # Runs at 0, 15, 30, 45 minutes past every hour (UTC)
    - cron: "0,15,30,45 * * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  sync-pending-sods:
    name: Sync Pending SODs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger Pending SOD Sync Batches
        run: |
          echo "Triggering SOD Pending Sync at $(date -u)"
          
          echo "Syncing Batch 1 (OPMCs 0-15)..."
          curl -s -f "https://sltserp.vercel.app/api/cron/sync-sod?secret=${{ secrets.CRON_SECRET }}&offset=0&limit=15" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" || echo "Batch 1 completed with status"
          
          echo "Syncing Batch 2 (OPMCs 15-30)..."
          curl -s -f "https://sltserp.vercel.app/api/cron/sync-sod?secret=${{ secrets.CRON_SECRET }}&offset=15&limit=15" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" || echo "Batch 2 completed with status"
          
          echo "Syncing Batch 3 (OPMCs 30-45)..."
          curl -s -f "https://sltserp.vercel.app/api/cron/sync-sod?secret=${{ secrets.CRON_SECRET }}&offset=30&limit=15" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" || echo "Batch 3 completed with status"
          
          echo "All SOD Sync Batches completed successfully."
