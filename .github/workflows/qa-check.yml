name: QA & Security Check

on:
  pull_request:
    branches: [ main, staging ]
  push:
    branches: [ main, staging ]
  workflow_dispatch:

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Run ESLint
        shell: bash
        run: |
          changed_files="$(git diff --name-only HEAD^ HEAD | grep -E '\\.(js|jsx|ts|tsx)$' || true)"
          if [ -n "$changed_files" ]; then
            printf '%s\n' "$changed_files" | xargs pnpm exec eslint
          else
            echo "No JavaScript/TypeScript files changed in this revision."
          fi

      - name: Strict TypeScript Compilation (Zero `any` Rule Check)
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set +e
          pnpm exec tsc --noEmit --pretty false 2>&1 | tee /tmp/slts-tsc.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error::$line"
            done < /tmp/slts-tsc.log
          fi
          exit "$status"

      - name: Production build
        run: pnpm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          # The build evaluates auth-protected route modules. This is a CI-only
          # secret; production uses the JWT_SECRET configured in the deployment environment.
          JWT_SECRET: ci-only-build-secret-not-for-production

      - name: Unit tests (SOD status authority policy and domain tables)
        run: pnpm run test:unit

      - name: Project workflow, finance and scope tests
        run: pnpm run test:project

      - name: Finance posting and lifecycle tests
        run: pnpm run test:finance

      - name: SOD sync invariants (read-only census against the live schema)
        # Diagnostic until the rewrite is in enforce mode: the census is legitimately empty and the
        # pre-rewrite history still holds its duplicate rows, so failing the job here would block
        # every PR for a state this rollout exists to remove. Promote it to a gate afterwards.
        continue-on-error: true
        run: pnpm run check:sync -- --hours=6
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL || secrets.DATABASE_URL }}

      # Production health/E2E checks belong after the immutable image has been
      # released and Coolify has switched traffic. Keeping them here creates a
      # circular gate: QA waits for production while production waits for QA.
