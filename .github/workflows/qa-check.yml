name: QA & Security Check

on:
  pull_request:
    branches: [ main, staging ]
  push:
    branches: [ main, staging ]
  workflow_dispatch:

jobs:
  qa-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Run ESLint
        shell: bash
        run: |
          changed_files="$(git diff --name-only HEAD^ HEAD | grep -E '\\.(js|jsx|ts|tsx)$' || true)"
          if [ -n "$changed_files" ]; then
            printf '%s\n' "$changed_files" | xargs pnpm exec eslint
          else
            echo "No JavaScript/TypeScript files changed in this revision."
          fi

      - name: Strict TypeScript Compilation (Zero `any` Rule Check)
        run: pnpm exec tsc --noEmit

      - name: Production build
        run: pnpm run build
        env:
          # The build evaluates auth-protected route modules. This is a CI-only
          # secret; production uses the JWT_SECRET configured in the deployment environment.
          JWT_SECRET: ci-only-build-secret-not-for-production

      - name: Unit tests (SOD status authority policy and domain tables)
        run: pnpm run test:unit

      - name: SOD sync invariants (read-only census against the live schema)
        # Diagnostic until the rewrite is in enforce mode: the census is legitimately empty and the
        # pre-rewrite history still holds its duplicate rows, so failing the job here would block
        # every PR for a state this rollout exists to remove. Promote it to a gate afterwards.
        continue-on-error: true
        run: pnpm run check:sync -- --hours=6
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: npx playwright test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          NEXTAUTH_SECRET: test-secret-for-ci
          NEXTAUTH_URL: http://localhost:3000
          NODE_ENV: test
