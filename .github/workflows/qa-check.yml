name: QA & Security Check

on:
  pull_request:
    branches: [ main, staging ]
  push:
    branches: [ staging ]

jobs:
  qa-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Strict TypeScript Compilation (Zero `any` Rule Check)
        run: npx tsc --noEmit
