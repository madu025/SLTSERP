name: SOD PAT Sync (Every 30 min)

on:
  schedule:
    # Runs at 0 and 30 minutes past every hour (UTC)
    - cron: "0,30 * * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  sync-pat:
    name: Sync PAT Results (HO Approved + Rejected)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger PAT Sync
        run: |
          echo "Triggering PAT Sync at $(date -u)"
          RESPONSE=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://sltserp.vercel.app/api/cron/sync-pat")
          
          echo "HTTP Status: $RESPONSE"
          cat /tmp/response.json | python3 -m json.tool 2>/dev/null || cat /tmp/response.json
          
          if [ "$RESPONSE" != "200" ]; then
            echo "ERROR: PAT Sync failed with HTTP $RESPONSE"
            exit 1
          fi
          echo "PAT Sync completed successfully."
