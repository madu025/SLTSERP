name: Build, release and deploy Coolify image

on:
  workflow_run:
    workflows: ["QA & Security Check"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One verified main revision owns one image build, one DB release, and one
# Coolify rollout. A newer revision supersedes all older work.
concurrency:
  group: coolify-production-main
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/madu025/slts-erp
  COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
  PRODUCTION_BASE_URL: https://slts.vynor.lk

jobs:
  prepare:
    name: Select and validate the release revision
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      current: ${{ steps.revision.outputs.current }}
    steps:
      - name: Select the latest verified main revision
        id: revision
        shell: bash
        env:
          QA_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          latest_sha="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk '{print $1}')"
          if [[ -z "$latest_sha" ]]; then
            echo "Could not resolve the current main revision." >&2
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" && "$latest_sha" != "$QA_HEAD_SHA" ]]; then
            echo "A newer main commit exists; this deployment is superseded."
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "sha=$QA_HEAD_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          selected_sha="${QA_HEAD_SHA:-$latest_sha}"
          echo "current=true" >> "$GITHUB_OUTPUT"
          echo "sha=$selected_sha" >> "$GITHUB_OUTPUT"
          echo "Selected revision ${selected_sha}."

      - name: Validate release configuration
        if: steps.revision.outputs.current != 'false'
        shell: bash
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_IMAGE_APP: ${{ secrets.COOLIFY_IMAGE_APPLICATION_UUID }}
          RELEASE_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          RELEASE_DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}
          SMOKE_USERNAME: ${{ secrets.PRODUCTION_SMOKE_USERNAME }}
          SMOKE_PASSWORD: ${{ secrets.PRODUCTION_SMOKE_PASSWORD }}
        run: |
          set -euo pipefail
          for name in COOLIFY_API_URL COOLIFY_IMAGE_APP COOLIFY_TOKEN RELEASE_DATABASE_URL RELEASE_DIRECT_URL SMOKE_USERNAME SMOKE_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required production release secret/configuration: $name" >&2
              exit 1
            fi
          done
          echo "Release configuration is present; secret values are not printed."

  build:
    name: Build and push immutable GHCR image
    needs: prepare
    if: needs.prepare.outputs.current != 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the verified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ needs.prepare.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Run one-time Prisma/data release job
    needs: [prepare, build]
    if: needs.prepare.outputs.current != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and run the release job from the exact image
        shell: bash
        env:
          RELEASE_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          RELEASE_DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}
          IMAGE_TAG: sha-${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}:${IMAGE_TAG}"
          docker pull --quiet "$image"
          docker run --rm --pull=never \
            --env DATABASE_URL="$RELEASE_DATABASE_URL" \
            --env DIRECT_URL="$RELEASE_DIRECT_URL" \
            --entrypoint node \
            "$image" scripts/production-release.mjs

  deploy:
    name: Deploy the exact image through Coolify
    needs: [prepare, release]
    if: needs.prepare.outputs.current != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Update Coolify image tag and verify image-only application
        id: configure
        shell: bash
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_IMAGE_APP: ${{ secrets.COOLIFY_IMAGE_APPLICATION_UUID }}
          IMAGE_TAG: sha-${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          api="${COOLIFY_API_URL%/}/api/v1"
          app="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${api}/applications/${COOLIFY_IMAGE_APP}")"
          build_pack="$(echo "$app" | jq -r '.build_pack // empty')"
          if [[ "$build_pack" != "dockerimage" ]]; then
            echo "Coolify application is not a Docker Image resource; refusing a mixed build/deploy path." >&2
            exit 1
          fi
          payload="$(jq -n --arg image "$IMAGE_NAME" --arg tag "$IMAGE_TAG" \
            '{docker_registry_image_name:$image,docker_registry_image_tag:$tag,is_auto_deploy_enabled:false,instant_deploy:false,health_check_enabled:true,rolling_update_drain_seconds:10,stop_grace_period:30}')"
          curl --fail --silent --show-error -X PATCH \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "${api}/applications/${COOLIFY_IMAGE_APP}" >/dev/null
          echo "Coolify is configured for immutable image tag ${IMAGE_TAG}."

      - name: Cancel superseded Coolify deployments
        shell: bash
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_IMAGE_APP: ${{ secrets.COOLIFY_IMAGE_APPLICATION_UUID }}
        run: |
          set -euo pipefail
          api="${COOLIFY_API_URL%/}/api/v1"
          deployments="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${api}/deployments/applications/${COOLIFY_IMAGE_APP}?take=20")"
          echo "$deployments" | jq -r '.deployments[]? | select((.status // "") | test("queued|in_progress|in-progress"; "i")) | .deployment_uuid' |
            while IFS= read -r deployment_uuid; do
              [[ -z "$deployment_uuid" ]] && continue
              curl --fail --silent --show-error -X POST \
                -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
                "${api}/deployments/${deployment_uuid}/cancel" >/dev/null || true
            done

      - name: Start the Coolify image deployment
        id: deploy
        shell: bash
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_IMAGE_APP: ${{ secrets.COOLIFY_IMAGE_APPLICATION_UUID }}
        run: |
          set -euo pipefail
          api="${COOLIFY_API_URL%/}/api/v1"
          response="$(curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "{\"uuid\":\"${COOLIFY_IMAGE_APP}\"}" \
            "${api}/deploy")"
          deployment_uuid="$(echo "$response" | jq -r '.deployments[0].deployment_uuid // empty')"
          if [[ -z "$deployment_uuid" ]]; then
            echo "Coolify did not return a deployment UUID." >&2
            exit 1
          fi
          echo "deployment_uuid=$deployment_uuid" >> "$GITHUB_OUTPUT"

      - name: Wait for Coolify and verify production health
        shell: bash
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          DEPLOYMENT_UUID: ${{ steps.deploy.outputs.deployment_uuid }}
        run: |
          set -euo pipefail
          api="${COOLIFY_API_URL%/}/api/v1"
          for attempt in {1..180}; do
            deployment="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
              "${api}/deployments/${DEPLOYMENT_UUID}")"
            status="$(echo "$deployment" | jq -r '.status // "unknown"')"
            echo "Coolify deployment status=${status}"
            case "$status" in
              finished|success|successful) break ;;
              failed|error|cancelled|cancelled-by-user)
                echo "Coolify deployment failed." >&2
                exit 1
                ;;
            esac
            if [[ "$attempt" == 180 ]]; then
              echo "Coolify deployment did not finish within 30 minutes." >&2
              exit 1
            fi
            sleep 10
          done
          curl --fail --silent --show-error "${PRODUCTION_BASE_URL}/api/health/live"
          curl --fail --silent --show-error "${PRODUCTION_BASE_URL}/api/health"

  production-smoke:
    name: Authenticated production smoke
    needs: deploy
    uses: ./.github/workflows/production-smoke.yml
    with:
      base_url: https://slts.vynor.lk
    secrets: inherit
