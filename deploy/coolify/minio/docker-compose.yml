services:
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER
      - MINIO_ROOT_PASSWORD
      - SERVICE_URL_MINIO_9000=/
    volumes:
      - minio_data:/bitnami/minio/data
    expose:
      - "9000"
      - "9001"

  minio-provision:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    restart: "no"
    depends_on:
      - minio
    environment:
      - MINIO_ROOT_USER
      - MINIO_ROOT_PASSWORD
      - S3_BUCKET
      - S3_ACCESS_KEY
      - S3_SECRET_KEY
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      set -eu;
      until /opt/bitnami/minio-client/bin/mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done;
      /opt/bitnami/minio-client/bin/mc mb --ignore-existing "local/$${S3_BUCKET}";
      /opt/bitnami/minio-client/bin/mc anonymous set none "local/$${S3_BUCKET}";
      if ! /opt/bitnami/minio-client/bin/mc admin user info local "$${S3_ACCESS_KEY}" >/dev/null 2>&1; then /opt/bitnami/minio-client/bin/mc admin user add local "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}"; fi;
      /opt/bitnami/minio-client/bin/mc admin policy attach local readwrite --user "$${S3_ACCESS_KEY}";
      /opt/bitnami/minio-client/bin/mc admin user info local "$${S3_ACCESS_KEY}";

volumes:
  minio_data:
    driver: local
